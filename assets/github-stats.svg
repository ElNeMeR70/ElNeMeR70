  <!-- Rank Ring on Right -->
  <g transform="translate(405, 108)">
    <circle cx="0" cy="0" r="44" stroke="#1e293b" stroke-width="6" fill="none"/>
    <circle cx="0" cy="0" r="44" stroke="#10B981" stroke-width="6" stroke-dasharray="255 280" stroke-linecap="round" fill="none" transform="rotate(-90)"/>
    <text x="0" y="6" text-anchor="middle" class="rank-text">S+</text>
    <text x="0" y="24" text-anchor="middle" class="rank-sub">GLOBAL TIER</text>
